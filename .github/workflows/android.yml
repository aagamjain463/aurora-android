name: Android

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Unit tests, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Gradle cache is keyed on the build scripts and the wrapper, so it never leaks across versions.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image ships the Android SDK and accepted licences. AGP downloads the missing platform (37).
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Unit tests include the Robolectric UI tests and renders every screenshot screen (without comparing pixels).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # The Phase 2A spike lives in the debug source set only. Fail if any of it reaches a release build.
      - name: Release excludes debug-only code
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          if unzip -p "$apk" 'classes*.dex' | grep -a -i -q spike; then
            echo "::error::Release APK contains debug-only spike code"
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  speed:
    name: Cold start under the limit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :benchmark:connectedPhoneAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.aurora.benchmark.StartupBenchmark --stacktrace
            python3 scripts/check-startup.py
