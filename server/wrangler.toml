name = "aurora-entitlements"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
PACKAGE_NAME = "app.aurora"
PRODUCT_IDS = "aurora_plus_monthly,aurora_plus_annual"
# The Firebase project whose ID tokens this server accepts.
FIREBASE_PROJECT_ID = "aurora-24aa9"
ENVIRONMENT = "production"
# Anti-abuse rollout (docs/ANTI_ABUSE.md, section 9). DEVICE_QUOTA: off, shadow (record only) or enforce.
# INTEGRITY: off, observe or enforce. APP_CERT_SHA256: Play's app signing certificate digest(s), comma-separated, in the
# base64url form verdicts report (not Play Console's colon hex; docs/ANTI_ABUSE_STAGING_TESTS.md, T5).
DEVICE_QUOTA = "shadow"
INTEGRITY = "off"
APP_CERT_SHA256 = ""

# wrangler d1 create aurora, then paste its id here. Then: wrangler d1 migrations apply aurora --remote
[[d1_databases]]
binding = "DB"
database_name = "aurora"
database_id = "6451367c-aaf3-4fa9-b124-2f307dd752e9"
migrations_dir = "migrations"

# Daily: finishes account deletions past their grace period and drops expired records.
[triggers]
crons = ["17 3 * * *"]

# Secrets, set with `wrangler secret put`: GOOGLE_SERVICE_ACCOUNT, FIREBASE_SERVICE_ACCOUNT, SIGNING_KEY, RTDN_TOKEN.
