name = "aurora-entitlements"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
# Google Play.
PACKAGE_NAME = "app.aurora"
PRODUCT_IDS = "aurora_plus_monthly,aurora_plus_annual"
# App Store. Its routes answer 503 until the APPLE_* secrets below are set.
APPLE_BUNDLE_ID = "com.aagamjain.Aurora"
APPLE_PRODUCT_IDS = "aurora_plus_monthly,aurora_plus_annual"
# App Review buys with a sandbox account in the production app, so this has to be "1" while Apple reviews a build.
# Sandbox receipts create only ios_sandbox review access; production Plus and quota ignore them.
APPLE_ALLOW_SANDBOX = "1"
# The Firebase project whose ID tokens this server accepts.
FIREBASE_PROJECT_ID = "aurora-24aa9"
ENVIRONMENT = "production"
# Anti-abuse rollout (docs/ANTI_ABUSE.md, section 9). DEVICE_QUOTA: off, shadow (record only) or enforce.
# INTEGRITY: off, observe or enforce. APP_CERT_SHA256: Play's app signing certificate digest(s), comma-separated, in the
# base64url form verdicts report (not Play Console's colon hex; docs/ANTI_ABUSE_STAGING_TESTS.md, T5).
DEVICE_QUOTA = "shadow"
INTEGRITY = "off"
APP_CERT_SHA256 = ""
# 14-day trial (docs/MONETIZATION_PLAN.md, 3.2): "on" or "off". Needs migration 0005 and the TRIAL_PEPPER secret; iOS
# claims also need APPLE_TEAM_ID and the DeviceCheck key. Android claims need Play Integrity set up (stage 4 above).
TRIAL = "off"
# Founding Lifetime (docs/MONETIZATION_PLAN.md, 3.4): "on" opens holds and shows the offer. Verified purchases are
# honored whatever this says. Needs migration 0006. The product must be a US-only one-time product in Play Console
# (non-consumable in App Store Connect, US storefront only), and must be deactivated by hand when sales close.
LIFETIME = "off"
LIFETIME_PRODUCT_ID = "aurora_plus_lifetime_us"
APPLE_LIFETIME_PRODUCT_ID = "aurora_plus_lifetime_us"
APPLE_TEAM_ID = ""
# "production" for App Store and TestFlight builds, "development" for Xcode-signed debug builds.
DEVICECHECK_ENV = "production"

# wrangler d1 create aurora, then paste its id here. Then: wrangler d1 migrations apply aurora --remote
[[d1_databases]]
binding = "DB"
database_name = "aurora"
database_id = "6451367c-aaf3-4fa9-b124-2f307dd752e9"
migrations_dir = "migrations"

# Daily: finishes account deletions past their grace period and drops expired records.
[triggers]
crons = ["17 3 * * *"]

# Secrets, set with `wrangler secret put`: GOOGLE_SERVICE_ACCOUNT, FIREBASE_SERVICE_ACCOUNT, SIGNING_KEY, RTDN_TOKEN,
# APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY (the App Store Connect .p8 file's contents), TRIAL_PEPPER (32+ random
# bytes; rotating it forgets every trial ever claimed, so never rotate it), DEVICECHECK_KEY_ID, DEVICECHECK_PRIVATE_KEY
# (a .p8 key with DeviceCheck enabled, from Certificates, Identifiers & Profiles > Keys).
